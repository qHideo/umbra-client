<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b39"/>
      <stop offset="1" stop-color="#090d1b"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7258d9"/>
      <stop offset="0.55" stop-color="#aa8cff"/>
      <stop offset="1" stop-color="#76ddff"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3b4ff"/>
      <stop offset="0.54" stop-color="#9b82ff"/>
      <stop offset="1" stop-color="#62d4ff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7d3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="10" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".78"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(0 0)">
    <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#tile)"/>
    <path d="M83 335C101 207 218 112 357 143c34 8 61 23 81 43" fill="none" stroke="url(#orbit)" stroke-width="17" stroke-linecap="round"/>
    <path d="M72 307c58 67 175 104 286 70 36-11 66-32 84-60" fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round" opacity=".9"/>
    <circle cx="276" cy="249" r="116" fill="url(#moon)"/>
    <circle cx="236" cy="255" r="108" fill="#11162b"/>
    <path d="M316 169c40 27 68 74 72 127" fill="none" stroke="#e3d5ff" stroke-width="5" stroke-linecap="round" opacity=".72"/>
    <g fill="#c8b6ff">
      <rect x="374" y="92" width="18" height="18" rx="3"/>
      <rect x="411" y="126" width="11" height="11" rx="2" opacity=".8"/>
      <rect x="105" y="163" width="12" height="12" rx="2" opacity=".75"/>
      <rect x="129" y="384" width="19" height="19" rx="3" opacity=".9"/>
    </g>
    <rect x="389" y="364" width="12" height="12" rx="2" fill="#73dfff"/>
  </g>
  <g filter="url(#shadow)" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="700">
    <text x="570" y="286" fill="url(#word)" font-size="184" letter-spacing="10">UMBRA</text>
    <text x="581" y="378" fill="#aa8cff" font-size="52" letter-spacing="21">CLIENT</text>
